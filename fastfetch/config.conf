# Fastfetch Configuration

# Enable title (user@hostname)
show_title = true

# Enable sections
show_os = true
show_kernel = true
show_uptime = true
show_packages = true
show_shell = true
show_resolution = true
show_theme = true
show_host = true
show_cpu = true
show_gpu = true
show_memory = true
show_de = true
show_wm = true
show_wmtheme = true
show_icons = true
show_font = true
show_cursor = true
show_terminal = true
show_terminalfont = true

[general]
show = true
color = none  # Remove this to enable custom colors

[colors]
title = #88C0D0  # Teal for title
key = #D8DEE9    # Light gray for module keys
separator = #B48EAD  # Purple for separators

[disk]
show = true
total = true
used = true
free = true
color = #A3BE8C  # Green for disk

[network]
show = true
color = #BF616A  # Red for network
